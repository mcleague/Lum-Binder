name: Publish Lum Binder release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        shell: pwsh
        env:
          WORKSHOP_API_URL: ${{ vars.WORKSHOP_API_URL }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet publish BinderApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$version `
            -p:UpdateRepository=$env:GITHUB_REPOSITORY `
            -p:WorkshopApiUrl=$env:WORKSHOP_API_URL `
            -p:WorkshopAdminBuild=false `
            -o publish
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Compress-Archive -Path publish\* -DestinationPath Lum-Binder-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" Lum-Binder-win-x64.zip --title "Lum Binder $env:GITHUB_REF_NAME" --generate-notes
